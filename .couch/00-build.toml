[stage]
name = "build"
timeout = 600
retries = 1

[[steps]]
name = "configure"
run = "cmake -S . -B build -DPAW_TARGET=native"

[[steps]]
name = "compile"
run = "cmake --build build --parallel 2"
timeout = 120

[artifacts]
paths = [
  "build/pawc",
  "build/pawv", 
  "build/libpaw.so",
  "build/libpaw.a",
]
