id = paw
name = Paw
tagline = An Easy to Use, featureful Programming Language!
summary = An easy, cute, featureful programming language which compiles down into a custom bytecode format.
description = """
Paw - An easy to use, featureful programming language.

It is written primarily in C.

It has many features of a mature programming language, and compiles down into a custom bytecode which can be run on the Paw Virtual Machine™ (PVM)

- Easy to Learn!!
- Modular, with support for external module loading via .so files
- Has a WASM build, so it can be run in the browser!
"""
